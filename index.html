<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppssi..</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
        }

        .square-box {
            width: 90vw;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            background: rgba(255, 112, 166, 0.06);
            border: 1.5px solid rgba(255, 112, 166, 0.35);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 112, 166, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .pink-title {
            color: #ff70a6;
            font-weight: 600;
            font-size: 1.35rem;
            margin-bottom: 1rem;
        }

        .message-text {
            color: #e0e0e0;
            font-size: 0.92rem;
            line-height: 1.7;
            margin-bottom: 0;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 m-0">

    <div class="square-box">
        <h2 class="pink-title">Tapos na Birthday mo Baby 😊</h2>
        <p class="message-text">
            Sana naging masaya ang araw mo. Ingat ka palagi, Baby!😊
        </p>
    </div>

</body>
</html>
